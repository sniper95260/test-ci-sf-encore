name: Run migrations (Docker)
description: Run Doctrine migrations inside Docker container

inputs:
  host:
    required: true
  user:
    required: true
  port:
    required: true
  path:
    required: true
  container:
    required: true

runs:
  using: composite
  steps:
    - name: Run migrations
      shell: bash
      run: |
        ssh -p "${{ inputs.port }}" "${{ inputs.user }}@${{ inputs.host }}" \
        "cd '${{ inputs.path }}' && \
        if find migrations -maxdepth 1 -type f -name 'Version*.php' | grep -q .; then
          docker exec ${{ inputs.container }} php bin/console doctrine:migrations:migrate --no-interaction --env=prod
        else
          echo 'No Doctrine migrations found. Skipping migration step.'
        fi"