name: Wait for MySQL
description: Wait until MySQL service is ready

runs:
  using: composite
  steps:
    - name: Wait for MySQL
      shell: bash
      run: |
        for i in {1..30}; do
          mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
          echo "Waiting for MySQL..."
          sleep 2
        done

        echo "MySQL did not become ready in time."
        exit 1