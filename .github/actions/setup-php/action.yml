name: Setup PHP
description: Setup PHP with optional Composer cache

inputs:
  php-version:
    description: PHP version to install
    required: true
  extensions:
    description: PHP extensions to install
    required: false
    default: ''
  tools:
    description: PHP tools to install
    required: false
    default: 'composer'
  use-composer-cache:
    description: Enable Composer cache
    required: false
    default: 'true'
  coverage:
    description: Coverage driver to enable
    required: false
    default: 'none'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: ${{ inputs.tools }}
        coverage: ${{ inputs.coverage }}

    - name: Get Composer cache directory
      if: ${{ inputs.use-composer-cache == 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      if: ${{ inputs.use-composer-cache == 'true' }}
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          composer-${{ runner.os }}-