name: Deploy Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: 0
      PHP_PATH: /usr/bin/php8.3-cli

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: intl
          tools: composer
          use-composer-cache: 'true'

      - name: Install PHP dependencies for production
        uses: ./.github/actions/install-php-deps
        with:
          production: 'true'
          validate-composer: 'false'

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: '24'

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-deps

      - name: Build assets for production
        run: npm run build

      - name: Generate build info
        uses: ./.github/actions/generate-build-info
        with:
          environment: 'prod'
          include-commit: 'false'
          include-build-number: 'false'

      - name: Prepare SSH
        uses: ./.github/actions/prepare-ssh
        with:
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_KNOWN_HOSTS }}

      - name: Ensure remote path exists
        uses: ./.github/actions/ensure-remote-path
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}

      - name: Deploy files with rsync
        uses: ./.github/actions/deploy-rsync
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}

      - name: Check PHP CLI is available on production
        uses: ./.github/actions/check-php-cli
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          php-path: ${{ env.PHP_PATH }}

      - name: Clear Symfony cache before Doctrine commands
        uses: ./.github/actions/clear-cache-cli
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}
          php-path: ${{ env.PHP_PATH }}

      - name: Create database if needed
        uses: ./.github/actions/create-db-cli
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}
          php-path: ${{ env.PHP_PATH }}

      - name: Run Doctrine migrations if any exist
        uses: ./.github/actions/migrate-cli
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}
          php-path: ${{ env.PHP_PATH }}

      - name: Warm Symfony cache after deploy
        uses: ./.github/actions/warmup-cache-cli
        with:
          host: ${{ secrets.PROD_HOST }}
          user: ${{ secrets.PROD_USER }}
          port: ${{ secrets.PROD_PORT }}
          path: ${{ secrets.PROD_PATH }}
          php-path: ${{ env.PHP_PATH }}