name: Deploy Production

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: intl
          tools: composer
          use-composer-cache: 'true'

      - name: Install PHP dependencies for production
        uses: ./.github/actions/install-php-deps
        with:
          production: 'true'
          validate-composer: 'false'

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-deps

      - name: Build assets for production
        run: npm run build

      - name: Generate build info
        uses: ./.github/actions/generate-build-info
        with:
          environment: 'prod'
          include-commit: 'false'
          include-build-number: 'false'

      - name: Prepare SSH
        uses: ./.github/actions/prepare-ssh
        with:
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_KNOWN_HOSTS }}

      - name: Ensure remote path exists
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "mkdir -p '${{ secrets.PROD_PATH }}'"

      - name: Deploy files with rsync
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.PROD_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude "scripts" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.*.local" \
            --exclude "var/" \
            ./ \
            "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}:${{ secrets.PROD_PATH }}/"

      - name: Check PHP CLI is available on production
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "test -x /usr/bin/php8.3-cli"

      - name: Clear Symfony cache before Doctrine commands
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "cd '${{ secrets.PROD_PATH }}' && \
          /usr/bin/php8.3-cli bin/console cache:clear --env=prod"

      - name: Create database if needed
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "cd '${{ secrets.PROD_PATH }}' && \
          /usr/bin/php8.3-cli bin/console doctrine:database:create --if-not-exists --env=prod"

      - name: Run Doctrine migrations if any exist
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "cd '${{ secrets.PROD_PATH }}' && \
          if find migrations -maxdepth 1 -type f -name 'Version*.php' | grep -q .; then
            /usr/bin/php8.3-cli bin/console doctrine:migrations:migrate --no-interaction --env=prod
          else
            echo 'No Doctrine migrations found. Skipping migration step.'
          fi"

      - name: Warm Symfony cache after deploy
        run: |
          ssh -p "${{ secrets.PROD_PORT }}" "${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}" \
          "cd '${{ secrets.PROD_PATH }}' && \
          /usr/bin/php8.3-cli bin/console cache:warmup --env=prod"