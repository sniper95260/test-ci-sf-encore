name: Symfony CI

on:
  pull_request:
    branches:
      - dev
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: swat_db_test_ci
          MYSQL_USER: symfony
          MYSQL_PASSWORD: symfony
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/swat_db_test_ci?serverVersion=8.0&charset=utf8mb4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready in time."
          exit 1

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists --env=test

      - name: Run Doctrine migrations if any exist
        run: |
          if find migrations -maxdepth 1 -type f -name 'Version*.php' | grep -q .; then
            php bin/console doctrine:migrations:migrate --no-interaction --env=test
          else
            echo "No Doctrine migrations found. Skipping migration step."
          fi

      - name: Validate Doctrine schema
        run: php bin/console doctrine:schema:validate --env=test

      - name: Ensure no migration diff is pending
        run: |
          php bin/console doctrine:migrations:diff --no-interaction --env=test || true

          if [ -n "$(git status --porcelain -- migrations/)" ]; then
            echo "Unexpected migration diff detected."
            echo "A migration is probably missing or the schema is out of sync."
            git status --porcelain -- migrations/
            exit 1
          fi

      - name: Lint YAML config
        run: php bin/console lint:yaml config --parse-tags

      - name: Lint Twig templates
        run: php bin/console lint:twig templates

      - name: Lint Symfony container
        run: php bin/console lint:container

      - name: Run PHPUnit tests
        run: php bin/phpunit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build