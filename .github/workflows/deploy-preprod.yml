name: Deploy Preprod

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: intl
          tools: composer
          use-composer-cache: 'false'

      - name: Install PHP dependencies for production
        uses: ./.github/actions/install-php-deps
        with:
          production: 'true'
          validate-composer: 'false'

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-deps

      - name: Build assets for production
        run: npm run build
        env:
          APP_PUBLIC_PATH: '/test-ci-sf-encore/build'

      - name: Generate build info
        uses: ./.github/actions/generate-build-info
        with:
          environment: 'preprod'
          include-commit: 'true'
          include-build-number: 'true'

      - name: Prepare SSH
        uses: ./.github/actions/prepare-ssh
        with:
          ssh-key: ${{ secrets.PREPROD_SSH_KEY }}
          known-hosts: ${{ secrets.PREPROD_KNOWN_HOSTS }}

      - name: Ensure remote path exists
        uses: ./.github/actions/ensure-remote-path
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          path: ${{ secrets.PREPROD_PATH }}

      - name: Deploy files with rsync
        uses: ./.github/actions/deploy-rsync
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          path: ${{ secrets.PREPROD_PATH }}
          extra-excludes: |
            database/
            Dockerfile
            docker-compose.yml
            entrypoint.sh

      - name: Check PHP container is running
        uses: ./.github/actions/check-docker-container
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          container: test-ci-sf-encore-php

      - name: Clear Symfony cache before Doctrine commands
        uses: ./.github/actions/clear-cache-docker
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          container: test-ci-sf-encore-php

      - name: Create database if needed in container
        uses: ./.github/actions/create-db-docker
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          container: test-ci-sf-encore-php

      - name: Dry run Doctrine migrations in container if any exist
        uses: ./.github/actions/migrate-dry-docker
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          path: ${{ secrets.PREPROD_PATH }}
          container: test-ci-sf-encore-php

      - name: Run Doctrine migrations in container if any exist
        uses: ./.github/actions/migrate-docker
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          path: ${{ secrets.PREPROD_PATH }}
          container: test-ci-sf-encore-php

      - name: Warm Symfony cache after deploy
        uses: ./.github/actions/warmup-cache-docker
        with:
          host: ${{ secrets.PREPROD_HOST }}
          user: ${{ secrets.PREPROD_USER }}
          port: ${{ secrets.PREPROD_PORT }}
          container: test-ci-sf-encore-php