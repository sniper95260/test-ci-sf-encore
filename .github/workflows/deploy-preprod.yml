name: Deploy Preprod

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_DEBUG: 0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: ./.github/actions/setup-php
        with:
          php-version: '8.3'
          extensions: intl
          tools: composer
          use-composer-cache: 'false'

      - name: Install PHP dependencies for production
        uses: ./.github/actions/install-php-deps
        with:
          production: 'true'
          validate-composer: 'false'

      - name: Setup Node
        uses: ./.github/actions/setup-node
        with:
          node-version: '20'

      - name: Install Node dependencies
        uses: ./.github/actions/install-node-deps

      - name: Build assets for production
        run: npm run build
        env:
          APP_PUBLIC_PATH: '/test-ci-sf-encore/build'

      - name: Generate build info
        uses: ./.github/actions/generate-build-info
        with:
          environment: 'preprod'
          include-commit: 'true'
          include-build-number: 'true'

      - name: Prepare SSH
        uses: ./.github/actions/prepare-ssh
        with:
          ssh-key: ${{ secrets.PREPROD_SSH_KEY }}
          known-hosts: ${{ secrets.PREPROD_KNOWN_HOSTS }}

      - name: Ensure remote path exists
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "mkdir -p '${{ secrets.PREPROD_PATH }}'"

      - name: Deploy files with rsync
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.PREPROD_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude "scripts" \
            --exclude ".env" \
            --exclude ".env.local" \
            --exclude ".env.*.local" \
            --exclude "var/" \
            --exclude "database/" \
            --exclude "Dockerfile" \
            --exclude "docker-compose.yml" \
            --exclude "entrypoint.sh" \
            ./ \
            "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}:${{ secrets.PREPROD_PATH }}/"

      - name: Check PHP container is running
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "docker ps --format '{{.Names}}' | grep -qx 'test-ci-sf-encore-php'"

      - name: Clear Symfony cache before Doctrine commands
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "docker exec test-ci-sf-encore-php php bin/console cache:clear --env=prod"

      - name: Create database if needed in container
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "docker exec test-ci-sf-encore-php php bin/console doctrine:database:create --if-not-exists --env=prod"

      - name: Dry run Doctrine migrations in container if any exist
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "cd '${{ secrets.PREPROD_PATH }}' && \
          if find migrations -maxdepth 1 -type f -name 'Version*.php' | grep -q .; then
            docker exec test-ci-sf-encore-php php bin/console doctrine:migrations:migrate --dry-run --no-interaction --env=prod
          else
            echo 'No Doctrine migrations found. Skipping dry-run migration step.'
          fi"

      - name: Run Doctrine migrations in container if any exist
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "cd '${{ secrets.PREPROD_PATH }}' && \
          if find migrations -maxdepth 1 -type f -name 'Version*.php' | grep -q .; then
            docker exec test-ci-sf-encore-php php bin/console doctrine:migrations:migrate --no-interaction --env=prod
          else
            echo 'No Doctrine migrations found. Skipping migration step.'
          fi"

      - name: Warm Symfony cache after deploy
        run: |
          ssh -p "${{ secrets.PREPROD_PORT }}" "${{ secrets.PREPROD_USER }}@${{ secrets.PREPROD_HOST }}" \
          "docker exec test-ci-sf-encore-php php bin/console cache:warmup --env=prod"